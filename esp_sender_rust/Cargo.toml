[package]
name = "esp_sender_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = "4.5"
sysinfo = "0.37.2"
anyhow = "1.0"
regex = "1.11"
tray-item = "0.8"
chrono = "0.4.44"
wmi = "0.18.4"
serde = { version = "1.0.228", features = ["derive"] }
winapi = { version = "0.3.9", features = ["winuser", "wincon", "processenv", "winbase", "consoleapi"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
